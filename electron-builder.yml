appId: com.danlafeir.finances
productName: Finances
directories:
  output: release

# Explicit allowlist: the Electron shell itself has no npm dependencies of
# its own (main.js/preload.js/settingsStore.js only use Electron + Node
# builtins), so nothing from node_modules needs to ship here. The actual app
# -- Next.js, Prisma, Plaid, libsql and its native binding -- ships as one
# self-contained folder copied in by afterPack.js instead (dev.db and local
# secrets, which live at the repo root, never enter .next/standalone in the
# first place -- see electron/copy-assets.js).
files:
  - electron/main.js
  - electron/preload.js
  - electron/settingsStore.js
  - package.json

# .next/standalone is copied in here rather than via extraResources: that
# silently drops any nested node_modules directory (verified empirically --
# see electron/afterPack.js).
afterPack: electron/afterPack.js

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.finance

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Finance
