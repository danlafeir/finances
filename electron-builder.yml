appId: com.danlafeir.finances
productName: Finances
directories:
  output: release

# Explicit allowlist: the Electron shell itself has no npm dependencies of
# its own (main.js/preload.js/settingsStore.js only use Electron + Node
# builtins), so nothing from node_modules needs to ship here. The actual app
# -- Next.js, Prisma, Plaid, libsql and its native binding -- ships as one
# self-contained folder via extraResources instead. This also guarantees
# dev.db and .env (which live at the repo root) can never end up in a build.
files:
  - electron/main.js
  - electron/preload.js
  - electron/settingsStore.js
  - package.json

extraResources:
  - from: .next/standalone
    to: app

mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.finance

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Finance
